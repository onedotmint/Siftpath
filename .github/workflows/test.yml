name: Verify Siftpath
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run sync:integrations
      - run: git diff --exit-code -- integrations .agents .cursor-plugin .claude-plugin
      - run: npm run check
      - run: npm run bench:bm25
      - run: npm run verify:source
      - run: npm run test:live
      - run: npm run pack:dry
      - run: node tests/installed-package-smoke.mjs
      - name: Interactive Clack keyboard smoke (real PTY)
        if: runner.os == 'Linux'
        run: python3 tests/setup-pty-smoke.py

  mcp-official-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @modelcontextprotocol/client@2.3.1
      - run: node tests/official-mcp-smoke.mjs
      - run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @mozilla/readability@0.6.0 linkedom@0.18.12
      - run: node tests/optional-html-smoke.mjs
      - name: Install published Pi host for extension compatibility smoke
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @earendil-works/pi-coding-agent@0.99.0
      - name: Load and render packaged Pi extension at narrow terminal widths
        run: node --test tests/pi-host-smoke.mjs
