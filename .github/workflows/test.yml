name: Verify Siftpath
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  SIFTPATH_LIVE: '0'
  SIFTPATH_LIVE_STDIO: '0'
  SIFTPATH_OPTIONAL_LIVE: '0'
  SIFTPATH_CONTRACT: '0'
  SIFTPATH_PI_LIVE: '0'
  SIFTPATH_FIRECRAWL_CSS: '0'
  SIFTPATH_SELECTIVE_SCHEMA: '0'
  SIFTPATH_READER_COMPARE: '0'
  SIFTPATH_READ_QUALITY: '0'
jobs:
  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - name: Install pinned Pi for no-inference registration checks
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/siftpath-pi" --ignore-scripts --no-audit --no-fund @earendil-works/pi-coding-agent@1.4.0
          node --input-type=module -e 'import {readFileSync,appendFileSync} from "node:fs"; import {join} from "node:path"; const root=join(process.env.RUNNER_TEMP,"siftpath-pi","node_modules","@earendil-works","pi-coding-agent"); const pkg=JSON.parse(readFileSync(join(root,"package.json"),"utf8")); appendFileSync(process.env.GITHUB_ENV,`SIFTPATH_PI_BIN=${join(root,pkg.bin.pi)}\n`);'
      - run: npm run check
      - if: runner.os == 'Linux'
        run: npm run test:setup
      - run: npm run verify:source
      - run: npm run test:live
      - run: npm run pack:dry
      - run: npm run verify:package
      - run: git diff --check

  # Production High/Critical blocks the matrix. The full tree, including dev
  # tooling, is audited and reported separately below.
  audit:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - name: Production dependency audit (release gate)
        run: npm audit --omit=dev --audit-level=high
      - name: Full dependency tree audit (dev included, recorded)
        continue-on-error: true
        run: npm audit --audit-level=high
      - name: Record production and development audit findings
        if: always()
        run: npm run verify:audit

  # npm 12 returns `npm pack --json` keyed by package name instead of an array.
  # Ubuntu keeps the functional matrix single and adds only the npm majors.
  npm-compat:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 22
            npm: 11
          - node: 24
            npm: 12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install npm ${{ matrix.npm }}
        run: npm install --global --ignore-scripts --no-audit --no-fund npm@${{ matrix.npm }}
      - run: npm --version
      - run: npm ci --ignore-scripts
      - name: Install pinned Pi for no-inference registration checks
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/siftpath-pi" --ignore-scripts --no-audit --no-fund @earendil-works/pi-coding-agent@1.4.0
          node --input-type=module -e 'import {readFileSync,appendFileSync} from "node:fs"; import {join} from "node:path"; const root=join(process.env.RUNNER_TEMP,"siftpath-pi","node_modules","@earendil-works","pi-coding-agent"); const pkg=JSON.parse(readFileSync(join(root,"package.json"),"utf8")); appendFileSync(process.env.GITHUB_ENV,`SIFTPATH_PI_BIN=${join(root,pkg.bin.pi)}\n`);'
      - run: npm run build
      - run: npm run verify:package
