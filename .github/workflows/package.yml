name: Package Siftpath prerelease
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run sync:integrations
      - run: git diff --exit-code -- integrations .agents .cursor-plugin .claude-plugin
      - run: npm run check
      - run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: siftpath-npm-prerelease
          path: '*.tgz'
# Publishing remains a deliberate maintainer action; this workflow never writes a release or publishes to npm.
