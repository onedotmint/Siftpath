version: 2
updates:
  # The core groups only low-risk development bumps; every runtime
  # dependency (`@modelcontextprotocol/sdk`, `zod`) keeps its own PR and review,
  # because versions here change transport, cancellation or input validation.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    versioning-strategy: increase
    # Keep Node types aligned with the minimum supported runtime (Node 22).
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      development-minor-patch:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - minor
          - patch
  # DSH ABI upgrades remain deliberate: its engine and service peers must agree.
  - package-ecosystem: npm
    directory: /packages/dsh-siftpath
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    versioning-strategy: increase
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
# No merge and no publish step: Dependabot only opens PRs, and the existing
# workflows still gate every one of them on tests, audits and the tarball checks.
